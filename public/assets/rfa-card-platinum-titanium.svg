<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1050" width="100%" height="100%">
  <defs>
    <!-- Brushed Titanium Radial Background -->
    <radialGradient id="titaniumBg" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#282a33" />
      <stop offset="45%" stop-color="#16181e" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </radialGradient>

    <!-- Polished Platinum Gradients -->
    <linearGradient id="platinumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="silverSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <linearGradient id="silverChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Diamond Geometric Grid -->
    <pattern id="diamondGrid" width="30" height="30" patternUnits="userSpaceOnUse" opacity="0.08">
      <path d="M15 0 L30 15 L15 30 L0 15 Z" fill="none" stroke="#ffffff" stroke-width="0.8" />
      <circle cx="15" cy="15" r="1.5" fill="#ffffff" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="silverGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ffffff" flood-opacity="0.35" />
    </filter>

    <filter id="platCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- 1. BASE TITANIUM BACKGROUND -->
  <rect width="600" height="1050" fill="url(#titaniumBg)" />
  <rect width="600" height="1050" fill="url(#diamondGrid)" />

  <!-- 2. SPECULAR LASER HIGHLIGHT REFLECTION -->
  <g opacity="0.12">
    <line x1="-150" y1="1200" x2="750" y2="-150" stroke="url(#silverSheen)" stroke-width="90" />
    <line x1="-80" y1="1250" x2="820" y2="-80" stroke="#ffffff" stroke-width="20" />
  </g>

  <!-- 3. PLATINUM INLAID BEVELED RIM -->
  <rect x="14" y="14" width="572" height="1022" rx="36" fill="none"
        stroke="url(#platinumGrad)" stroke-width="2.5" filter="url(#silverGlow)" />
  <rect x="22" y="22" width="556" height="1006" rx="30" fill="none"
        stroke="#ffffff" stroke-width="0.8" opacity="0.25" />

  <!-- 5. PLATINUM EMV SMART CHIP -->
  <g transform="translate(56, 172)" filter="url(#silverGlow)">
    <rect x="0" y="0" width="76" height="58" rx="8" fill="url(#silverChip)" stroke="#334155" stroke-width="1.2" />
    <rect x="2" y="2" width="72" height="54" rx="6" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.6" />
    <path d="M 0 29 L 24 29 M 52 29 L 76 29 M 24 0 L 24 58 M 52 0 L 52 58 M 24 16 L 52 16 M 24 42 L 52 42 M 38 16 L 38 42"
          stroke="#1e293b" stroke-width="1.5" fill="none" opacity="0.7" />
    <rect x="30" y="22" width="16" height="14" rx="3" fill="none" stroke="#1e293b" stroke-width="1.2" opacity="0.8" />
  </g>

  <!-- 6. CONTACTLESS NFC WAVES SYMBOL -->
  <g transform="translate(150, 184)" stroke="url(#platinumGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 0 10 A 10 10 0 0 1 0 24" />
    <path d="M 6 5 A 18 18 0 0 1 6 29" />
    <path d="M 12 0 A 26 26 0 0 1 12 34" />
    <path d="M 18 -5 A 34 34 0 0 1 18 39" />
  </g>

  <!-- 7. RIGHT TAB CUTOUT PILL (CONTAINER FOR QR CODE) -->
  <g filter="url(#platCardShadow)">
    <path d="M 400 360 L 600 360 L 600 492 L 400 492 A 66 66 0 0 1 400 360 Z"
          fill="#0e1017" stroke="url(#platinumGrad)" stroke-width="2.5" />
    <path d="M 404 366 L 600 366 L 600 486 L 404 486 A 60 60 0 0 1 404 366 Z"
          fill="#161822" stroke="#ffffff" stroke-width="0.6" opacity="0.2" />
  </g>

  <!-- 8. CENTER BANNER CUTOUT PILL (CONTAINER FOR BARCODE / PASSCODE) -->
  <g filter="url(#platCardShadow)">
    <path d="M 0 520 L 485 520 A 64 64 0 0 1 485 648 L 0 648 Z"
          fill="#0e1017" stroke="url(#platinumGrad)" stroke-width="2.5" />
    <path d="M 0 526 L 479 526 A 58 58 0 0 1 479 642 L 0 642 Z"
          fill="#161822" stroke="#ffffff" stroke-width="0.6" opacity="0.2" />
  </g>

  <!-- 9. EMBOSSED CARD CREDENTIAL NUMBER -->
  <g transform="translate(60, 715)">
    <text x="0" y="0" font-family="'Courier New', monospace, sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="url(#silverSheen)" opacity="0.9">
      TITANIUM 4018 •••• •••• 2026
    </text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#64748b">
      AEROSPACE GRADE ALL-ACCESS CREDENTIAL
    </text>
  </g>

  <!-- 10. BOTTOM-RIGHT MEMBERSHIP WATERMARK / TEXT -->
  <g transform="translate(540, 920)">
    <text x="0" y="0" text-anchor="end" font-family="'Plus Jakarta Sans', serif, sans-serif" font-weight="900" font-size="23" fill="url(#platinumGrad)" letter-spacing="6">
      PLATINUM ELITE
    </text>
    <text x="0" y="20" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#94a3b8" letter-spacing="3">
      EXECUTIVE GLOBAL PASS
    </text>
  </g>
</svg>
