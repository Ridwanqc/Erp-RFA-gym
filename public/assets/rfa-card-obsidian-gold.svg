<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1050" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Metallic Radial Background -->
    <radialGradient id="obsidianBg" cx="40%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#16171c" />
      <stop offset="45%" stop-color="#0c0d10" />
      <stop offset="100%" stop-color="#040405" />
    </radialGradient>

    <!-- 24K Polished Gold Gradients -->
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe899" />
      <stop offset="25%" stop-color="#e6b800" />
      <stop offset="50%" stop-color="#fff2a3" />
      <stop offset="75%" stop-color="#b38600" />
      <stop offset="100%" stop-color="#805d00" />
    </linearGradient>

    <linearGradient id="goldSheenH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b38600" />
      <stop offset="30%" stop-color="#ffeaa7" />
      <stop offset="50%" stop-color="#fff9d6" />
      <stop offset="70%" stop-color="#e6b800" />
      <stop offset="100%" stop-color="#805d00" />
    </linearGradient>

    <linearGradient id="goldRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="20%" stop-color="#997300" />
      <stop offset="50%" stop-color="#fff3b0" />
      <stop offset="80%" stop-color="#b38600" />
      <stop offset="100%" stop-color="#ffe066" />
    </linearGradient>

    <!-- Titanium Brushed Stripes -->
    <linearGradient id="brushGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>

    <!-- Chip Brass Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8" />
      <stop offset="40%" stop-color="#d4af37" />
      <stop offset="70%" stop-color="#aa820a" />
      <stop offset="100%" stop-color="#f5e08c" />
    </linearGradient>

    <!-- Intricate Luxury Guilloche Rosette Pattern -->
    <pattern id="guillochePattern" width="120" height="120" patternUnits="userSpaceOnUse" opacity="0.12">
      <circle cx="60" cy="60" r="50" fill="none" stroke="#d4af37" stroke-width="0.8" />
      <circle cx="60" cy="60" r="40" fill="none" stroke="#d4af37" stroke-width="0.6" stroke-dasharray="2,2" />
      <circle cx="60" cy="60" r="30" fill="none" stroke="#d4af37" stroke-width="0.5" />
      <circle cx="60" cy="60" r="20" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="3,2" />
      <circle cx="60" cy="60" r="10" fill="none" stroke="#d4af37" stroke-width="0.6" />
      <!-- Radial Rays -->
      <line x1="60" y1="0" x2="60" y2="120" stroke="#d4af37" stroke-width="0.4" />
      <line x1="0" y1="60" x2="120" y2="60" stroke="#d4af37" stroke-width="0.4" />
      <line x1="17" y1="17" x2="103" y2="103" stroke="#d4af37" stroke-width="0.4" />
      <line x1="103" y1="17" x2="17" y2="103" stroke="#d4af37" stroke-width="0.4" />
    </pattern>

    <!-- Fine Geometric Weave Pattern -->
    <pattern id="luxWeave" width="20" height="20" patternUnits="userSpaceOnUse" opacity="0.08">
      <path d="M0 10 L10 0 L20 10 L10 20 Z" fill="none" stroke="#ffffff" stroke-width="0.6" />
      <circle cx="10" cy="10" r="2" fill="#d4af37" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffd700" flood-opacity="0.4" />
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- 1. BASE OBSIDIAN BACKGROUND -->
  <rect width="600" height="1050" fill="url(#obsidianBg)" />

  <!-- 2. GUILLOCHE LUXURY CURVES -->
  <rect width="600" height="1050" fill="url(#guillochePattern)" />
  <rect width="600" height="1050" fill="url(#luxWeave)" />

  <!-- 3. DIAGONAL METALLIC SPECULAR SHEEN (Simulating premium brushed finish) -->
  <g opacity="0.15">
    <line x1="-200" y1="1200" x2="800" y2="-200" stroke="url(#goldSheenH)" stroke-width="120" />
    <line x1="-100" y1="1300" x2="900" y2="-100" stroke="#ffffff" stroke-width="30" />
  </g>

  <!-- 4. 24K GOLD METALLIC INLAID BEVELED RIM (OUTER CARD BORDER) -->
  <rect x="14" y="14" width="572" height="1022" rx="36" fill="none"
        stroke="url(#goldRimGrad)" stroke-width="2.5" filter="url(#goldGlow)" />
  <rect x="22" y="22" width="556" height="1006" rx="30" fill="none"
        stroke="#ffd700" stroke-width="0.8" opacity="0.4" />

  <!-- 5. TOP HEADER SECTION: ROYAL EMBOSSED BRANDING -->
  <g transform="translate(60, 48)">
    <!-- Polished Gold Flame / Crown Crest -->
    <g transform="translate(0, 0) scale(0.95)" filter="url(#goldGlow)">
      <path d="M 18,36 C 36,12 86,6 108,14 C 90,24 68,26 55,30 C 80,30 105,42 101,62 C 98,76 80,84 62,84 L 50,84 L 72,110 C 62,110 52,107 40,96 L 27,78 L 32,54 Z"
            fill="url(#gold24k)" />
      <path d="M 46,42 C 55,40 76,41 78,57 C 79,67 67,71 54,71 L 40,71 Z" fill="#090a0d" />
      <path d="M 12,36 C 30,20 62,16 92,16 C 65,23 40,30 20,44 Z" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Typography: RFA GYM & ROYAL VIP CLUB -->
    <g transform="translate(135, 26)">
      <text x="0" y="30" font-family="'Plus Jakarta Sans', 'Cinzel', serif, sans-serif" font-weight="900" font-size="36" letter-spacing="3" fill="url(#goldSheenH)">
        RFA GYM
      </text>
      <!-- Sub-label -->
      <g transform="translate(0, 48)">
        <line x1="0" y1="-5" x2="30" y2="-5" stroke="url(#gold24k)" stroke-width="1.5" />
        <text x="36" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11.5" fill="#f5e08c" letter-spacing="4.5">
          ROYAL BLACK CARD VIP
        </text>
        <line x1="228" y1="-5" x2="258" y2="-5" stroke="url(#gold24k)" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- 6. AUTHENTIC 24K GOLD EMV SMART CHIP (Top-Left) -->
  <g transform="translate(56, 172)" filter="url(#goldGlow)">
    <!-- Chip Base Plate with Chamfered Corners -->
    <rect x="0" y="0" width="76" height="58" rx="8" fill="url(#chipGrad)" stroke="#664d00" stroke-width="1.2" />
    <!-- Metallic Inner Bevel -->
    <rect x="2" y="2" width="72" height="54" rx="6" fill="none" stroke="#fff8d6" stroke-width="0.8" opacity="0.7" />
    <!-- Chip Contact Traces / Circuit Grooves -->
    <path d="M 0 29 L 24 29 M 52 29 L 76 29 M 24 0 L 24 58 M 52 0 L 52 58 M 24 16 L 52 16 M 24 42 L 52 42 M 38 16 L 38 42"
          stroke="#403000" stroke-width="1.5" fill="none" opacity="0.6" />
    <!-- Central Processing Core Circle -->
    <rect x="30" y="22" width="16" height="14" rx="3" fill="none" stroke="#403000" stroke-width="1.2" opacity="0.7" />
  </g>

  <!-- 7. CONTACTLESS NFC WAVES SYMBOL (Next to Chip) -->
  <g transform="translate(150, 184)" stroke="url(#gold24k)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 0 10 A 10 10 0 0 1 0 24" />
    <path d="M 6 5 A 18 18 0 0 1 6 29" />
    <path d="M 12 0 A 26 26 0 0 1 12 34" />
    <path d="M 18 -5 A 34 34 0 0 1 18 39" />
  </g>

  <!-- 8. RIGHT TAB CUTOUT PILL (CONTAINER FOR QR CODE) -->
  <g filter="url(#cardShadow)">
    <path d="M 400 360 L 600 360 L 600 492 L 400 492 A 66 66 0 0 1 400 360 Z"
          fill="#0c0d12" stroke="url(#goldRimGrad)" stroke-width="2.5" />
    <path d="M 404 366 L 600 366 L 600 486 L 404 486 A 60 60 0 0 1 404 366 Z"
          fill="#14161f" stroke="#ffffff" stroke-width="0.6" opacity="0.2" />
  </g>

  <!-- 9. CENTER BANNER CUTOUT PILL (CONTAINER FOR BARCODE / PASSCODE) -->
  <g filter="url(#cardShadow)">
    <path d="M 0 520 L 485 520 A 64 64 0 0 1 485 648 L 0 648 Z"
          fill="#0c0d12" stroke="url(#goldRimGrad)" stroke-width="2.5" />
    <path d="M 0 526 L 479 526 A 58 58 0 0 1 479 642 L 0 642 Z"
          fill="#14161f" stroke="#ffffff" stroke-width="0.6" opacity="0.2" />
  </g>

  <!-- 10. GOLD EMBOSSED CARD NUMBER EMULATION -->
  <g transform="translate(60, 715)">
    <text x="0" y="0" font-family="'Courier New', monospace, sans-serif" font-weight="800" font-size="20" letter-spacing="4" fill="url(#goldSheenH)" opacity="0.9">
      RFA 9840 •••• •••• 2026
    </text>
    <text x="0" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#806600">
      AUTHENTIC ACCESS CREDENTIAL • LEVEL 5 EXECUTIVE
    </text>
  </g>

  <!-- 11. BOTTOM-RIGHT MEMBERSHIP WATERMARK / TEXT -->
  <g transform="translate(540, 920)">
    <text x="0" y="0" text-anchor="end" font-family="'Plus Jakarta Sans', serif, sans-serif" font-weight="900" font-size="23" fill="url(#gold24k)" letter-spacing="6">
      ROYAL VIP MEMBER
    </text>
    <text x="0" y="20" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#e6c65c" letter-spacing="3">
      FOUNDER'S CIRCLE ALL-ACCESS
    </text>
  </g>
</svg>
