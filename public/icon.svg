<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" stroke="#27272a" stroke-width="4"/>

  <!-- Subtle grid/hexagon background pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#f97316" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#f97316" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Central Emblem: Stylized Gym Barbell & Hex Dumbbell + Crown ERP Star -->
  <g filter="url(#glow)">
    <!-- Barbell Bar -->
    <rect x="130" y="244" width="252" height="24" rx="12" fill="#e4e4e7"/>
    <rect x="220" y="240" width="72" height="32" rx="8" fill="#a1a1aa"/>

    <!-- Left Weight Plates -->
    <rect x="156" y="160" width="28" height="192" rx="10" fill="url(#accentGrad)"/>
    <rect x="122" y="184" width="24" height="144" rx="8" fill="#f97316"/>
    <rect x="94" y="210" width="20" height="92" rx="6" fill="#c2410c"/>

    <!-- Right Weight Plates -->
    <rect x="328" y="160" width="28" height="192" rx="10" fill="url(#accentGrad)"/>
    <rect x="366" y="184" width="24" height="144" rx="8" fill="#f97316"/>
    <rect x="398" y="210" width="20" height="92" rx="6" fill="#c2410c"/>

    <!-- Center GymPro 'G' Hex Badge -->
    <polygon points="256,195 300,220 300,272 256,297 212,272 212,220" fill="#09090b" stroke="url(#accentGrad)" stroke-width="6"/>
    <path d="M 276 235 L 244 235 C 235 235 228 242 228 251 C 228 260 235 267 244 267 L 272 267 L 272 253 L 254 253" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- GymPro ERP Enterprise Typography -->
  <text x="256" y="405" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">GYMPRO</text>
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fb923c" text-anchor="middle" letter-spacing="6">ENTERPRISE ERP</text>
</svg>
